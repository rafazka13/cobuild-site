[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exercise-gifs"
version = "0.1.0"
description = "Generate looping exercise-demo GIFs for strength sessions with OpenAI GPT image models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=2.0,<4",
    "pillow>=10.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
exercise-gifs = "exercise_gifs.cli:main"

[tool.setuptools.packages.find]
include = ["exercise_gifs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
